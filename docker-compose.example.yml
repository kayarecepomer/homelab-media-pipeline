# Sanitized template — copy to compose.yml and fill in your own values.
# Never commit the real compose.yml: it will contain your VPN private key.

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}   # from your VPN provider, never commit
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESS}          # e.g. 10.x.x.x/32
      - SERVER_COUNTRIES=${VPN_COUNTRY}                   # e.g. United States
      - VPN_PORT_FORWARDING=on
      - FIREWALL_OUTBOUND_SUBNETS=${LAN_SUBNET},${TAILSCALE_SUBNET}
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./gluetun:/gluetun
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"   # no independent network path — see docs/network-architecture.md
    depends_on: [gluetun]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./qbittorrent:/config
      - ${MEDIA_ROOT}/torrents:/data/torrents
      - ${MEDIA_ROOT}/media:/data/media
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports: ["9696:9696"]
    volumes: ["./prowlarr:/config"]
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports: ["8989:8989"]
    volumes:
      - ./sonarr:/config
      - ${MEDIA_ROOT}:/data
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports: ["7878:7878"]
    volumes:
      - ./radarr:/config
      - ${MEDIA_ROOT}:/data
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    ports: ["6767:6767"]
    volumes:
      - ./bazarr:/config
      - ${MEDIA_ROOT}:/data
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    ports: ["5055:5055"]
    volumes: ["./jellyseerr:/app/config"]
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
    ports: ["8191:8191"]
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    network_mode: host
    volumes:
      - ./jellyfin:/config
      - ${MEDIA_ROOT}/media:/data/media
    restart: unless-stopped

  deunhealth:
    image: qmcgaw/deunhealth:latest
    container_name: deunhealth
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    restart: unless-stopped
