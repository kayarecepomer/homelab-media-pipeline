# Sanitized template — copy to compose.yml, copy .env.example to .env, and fill in
# your own values. Never commit the real compose.yml or .env: they contain your
# VPN private key.

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}   # from your VPN provider, never commit
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESS}          # e.g. 10.x.x.x/32
      - SERVER_COUNTRIES=${VPN_COUNTRY}                   # e.g. United States
      - VPN_PORT_FORWARDING=on
      # The forwarded port changes on every reconnect; push it into qBittorrent's
      # API each time (needs "bypass authentication for clients on localhost").
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      - FIREWALL_OUTBOUND_SUBNETS=${LAN_SUBNET},${TAILSCALE_SUBNET}
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./gluetun:/gluetun
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"   # no independent network path — see docs/network-architecture.md
    depends_on: [gluetun]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./qbittorrent:/config
      # ONE mount for torrents and media. Two separate mounts (even on the same
      # disk) make hardlink imports silently fall back to copies — see
      # docs/lessons-learned.md.
      - ${MEDIA_ROOT}:/data
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports: ["9696:9696"]
    volumes: ["./prowlarr:/config"]
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports: ["8989:8989"]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./sonarr:/config
      - ${MEDIA_ROOT}:/data
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports: ["7878:7878"]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./radarr:/config
      - ${MEDIA_ROOT}:/data
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    ports: ["6767:6767"]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./bazarr:/config
      - ${MEDIA_ROOT}:/data
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    ports: ["5055:5055"]
    volumes: ["./jellyseerr:/app/config"]
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
    ports: ["8191:8191"]
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      # OpenCL runtime so HDR / Dolby Vision tone mapping works on Intel iGPUs
      - DOCKER_MODS=linuxserver/mods:jellyfin-opencl-intel
    volumes:
      - ./jellyfin:/config
      - ${MEDIA_ROOT}/media:/data/media
    devices:
      - /dev/dri:/dev/dri   # Intel Quick Sync / VAAPI hardware transcoding
    ports: ["8096:8096"]
    restart: unless-stopped

  deunhealth:
    image: qmcgaw/deunhealth:latest
    container_name: deunhealth
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    restart: unless-stopped
